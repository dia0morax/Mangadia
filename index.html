<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manga Eloquent Reader & Anki</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

    /* الشريط العلوي */
    header { position: sticky; top: 0; z-index: 50; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); padding: 10px 14px; border-bottom: 1px solid #1e293b; display: flex; gap: 8px; align-items: center; }
    #urlInput { flex: 1; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; }
    .btn { padding: 10px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 0.9rem; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #334155; color: #e2e8f0; }

    /* منطقة القراءة */
    #reader { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; min-height: 80vh; }
    .page-wrapper { width: 100%; position: relative; margin-bottom: 4px; }
    .manga-page { width: 100%; height: auto; display: block; background: #1e293b; min-height: 300px; }

    /* كانفاس التحديد باللمس */
    #selectionCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; display: none; cursor: crosshair; touch-action: none; }

    /* الأزرار العائمة */
    .fab-group { position: fixed; bottom: 20px; right: 20px; z-index: 90; display: flex; flex-direction: column; gap: 12px; }
    .fab { width: 56px; height: 56px; border-radius: 28px; border: none; box-shadow: 0 4px 14px rgba(0,0,0,0.5); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fab-crop { background: #2563eb; color: #fff; }
    .fab-crop.active { background: #ef4444; }
    .fab-vocab { background: #059669; color: #fff; }

    /* دائرة قارئ الأخطاء العائمة أسفل اليسار */
    #errorBadge { position: fixed; bottom: 20px; left: 20px; z-index: 90; width: 48px; height: 48px; border-radius: 24px; background: #1e293b; border: 2px solid #475569; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: all 0.2s ease; }
    #errorBadge.has-errors { background: #7f1d1d; border-color: #ef4444; color: #fee2e2; animation: pulse 2s infinite; }
    #errorCount { position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: none; }
    #errorBadge.has-errors #errorCount { display: block; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

    /* بطاقة الترجمة السفلية */
    #bottomSheet { position: fixed; bottom: -100%; left: 0; right: 0; max-height: 75vh; background: #0f172a; border-top: 2px solid #38bdf8; border-radius: 16px 16px 0 0; z-index: 110; padding: 16px 20px; box-shadow: 0 -8px 24px rgba(0,0,0,0.6); transition: bottom 0.3s ease-out; overflow-y: auto; }
    #bottomSheet.open { bottom: 0; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 12px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; }

    .section-title { font-size: 0.8rem; color: #94a3b8; margin: 6px 0; text-transform: uppercase; }
    .eng-box { font-size: 1.1rem; font-weight: 600; color: #38bdf8; margin-bottom: 12px; direction: ltr; text-align: left; }
    .ar-box { font-size: 1.15rem; color: #4ade80; margin-bottom: 16px; line-height: 1.6; font-weight: 500; }

    .words-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .word-card { background: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .word-card b { color: #facc15; direction: ltr; }
    .add-btn { background: #3b82f6; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .add-btn.saved { background: #10b981; }

    /* نوافذ منبثقة (الأخطاء والحافظة) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 130; display: none; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: #0f172a; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 520px; max-height: 82vh; display: flex; flex-direction: column; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); }
    .modal-list { overflow-y: auto; flex: 1; margin: 12px 0; }

    /* سجل تفاصيل الأخطاء */
    .error-entry { background: #182234; border: 1px solid #ef4444; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-family: monospace; font-size: 0.8rem; }
    .error-time { color: #94a3b8; font-size: 0.7rem; margin-bottom: 4px; }
    .error-msg { color: #f87171; font-weight: bold; word-break: break-all; direction: ltr; text-align: left; }
    .error-details { color: #cbd5e1; margin-top: 6px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; background: #0b0f19; padding: 6px; border-radius: 4px; direction: ltr; text-align: left; }

    .vocab-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #1e293b; }
    .vocab-item span b { color: #f87171; }
    .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1rem; }

    .loader { display: none; text-align: center; padding: 25px; font-size: 0.95rem; color: #38bdf8; }
  </style>
</head>
<body>

  <header>
    <input type="text" id="urlInput" placeholder="ضع رابط الفصل هنا...">
    <button class="btn btn-primary" id="loadBtn" onclick="loadManga()">قراءة</button>
  </header>

  <div id="reader"></div>

  <!-- الأزرار العائمة باليمين -->
  <div class="fab-group">
    <button class="fab fab-vocab" onclick="openVocabModal()" title="الحافظة وتصدير أنكي">📚</button>
    <button class="fab fab-crop" id="cropToggleBtn" onclick="toggleCropMode()" title="تحديد فقاعة للترجمة">✂️</button>
  </div>

  <!-- قارئ الأخطاء العائم باليسار -->
  <div id="errorBadge" onclick="openErrorModal()" title="سجل الأخطاء والتشخيص">
    🐞
    <span id="errorCount">0</span>
  </div>

  <canvas id="selectionCanvas"></canvas>

  <!-- نافذة الترجمة السفلية -->
  <div id="bottomSheet">
    <div class="sheet-header">
      <span style="font-weight:bold; color:#f8fafc;">ترجمة الحوار الفصيحة</span>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    <div id="loader" class="loader">جاري قراءة الحوار وترجمته بالعربية الفصيحة...</div>
    <div id="sheetContent" style="display:none;">
      <div class="section-title">النص الإنجليزي</div>
      <div id="englishText" class="eng-box"></div>
      
      <div class="section-title">الترجمة الفصيحة السياقية</div>
      <div id="arabicText" class="ar-box"></div>
      
      <div class="section-title">المفردات (اضغط + لحفظها في أنكي)</div>
      <div id="wordsContainer" class="words-container"></div>
    </div>
  </div>

  <!-- نافذة عرض الأخطاء والتشخيص -->
  <div id="errorModal" class="modal-overlay">
    <div class="modal-content">
      <div class="sheet-header">
        <span style="font-weight:bold; color:#f87171;">سجل الأخطاء والتشخيص (Debug Logs)</span>
        <button class="close-btn" onclick="closeErrorModal()">✕</button>
      </div>
      <div id="errorLogList" class="modal-list"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" style="flex:1;" onclick="copyErrorLogs()">نسخ السجل بالكامل</button>
        <button class="btn btn-secondary" onclick="clearErrorLogs()">مسح السجل</button>
      </div>
    </div>
  </div>

  <!-- نافذة الحافظة وتصدير أنكي -->
  <div id="vocabModal" class="modal-overlay">
    <div class="modal-content">
      <div class="sheet-header">
        <span style="font-weight:bold; color:#f8fafc;">حافظة الكلمات المحفوظة</span>
        <button class="close-btn" onclick="closeVocabModal()">✕</button>
      </div>
      <div id="vocabList" class="modal-list"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" style="flex:1;" onclick="exportAnkiTSV()">تصدير لـ Anki (.tsv)</button>
        <button class="btn btn-secondary" onclick="clearAllVocab()">تفريغ</button>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://diajb-manga.hf.space";

    const reader = document.getElementById('reader');
    const urlInput = document.getElementById('urlInput');
    const loadBtn = document.getElementById('loadBtn');
    const cropBtn = document.getElementById('cropToggleBtn');
    const canvas = document.getElementById('selectionCanvas');
    const ctx = canvas.getContext('2d');
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetContent = document.getElementById('sheetContent');
    const loader = document.getElementById('loader');
    const vocabModal = document.getElementById('vocabModal');
    const vocabList = document.getElementById('vocabList');
    const errorModal = document.getElementById('errorModal');
    const errorLogList = document.getElementById('errorLogList');
    const errorBadge = document.getElementById('errorBadge');
    const errorCount = document.getElementById('errorCount');

    let isCropMode = false;
    let startX = 0, startY = 0, endX = 0, endY = 0;
    let isDrawing = false;
    let currentSentence = "";
    let currentTranslation = "";

    // ----------------- نظام تتبع وتسجيل الأخطاء التلقائي -----------------
    let errorLogs = [];

    function logError(title, details = "") {
      const timeStr = new Date().toLocaleTimeString();
      const entry = { time: timeStr, title: String(title), details: typeof details === 'object' ? JSON.stringify(details, null, 2) : String(details) };
      errorLogs.unshift(entry);
      updateErrorUI();
    }

    function updateErrorUI() {
      if (errorLogs.length > 0) {
        errorBadge.classList.add('has-errors');
        errorCount.innerText = errorLogs.length;
      } else {
        errorBadge.classList.remove('has-errors');
        errorCount.innerText = "0";
      }
    }

    function openErrorModal() {
      renderErrorLogs();
      errorModal.style.display = 'flex';
    }

    function closeErrorModal() {
      errorModal.style.display = 'none';
    }

    function renderErrorLogs() {
      if (!errorLogs.length) {
        errorLogList.innerHTML = "<p style='color:#94a3b8; text-align:center;'>لا توجد أي أخطاء مسجلة، كل العمليات سليمة.</p>";
        return;
      }
      errorLogList.innerHTML = "";
      errorLogs.forEach((err) => {
        const item = document.createElement('div');
        item.className = 'error-entry';
        item.innerHTML = `
          <div class="error-time">[${err.time}]</div>
          <div class="error-msg">${err.title}</div>
          ${err.details ? `<div class="error-details">${err.details}</div>` : ''}
        `;
        errorLogList.appendChild(item);
      });
    }

    function clearErrorLogs() {
      errorLogs = [];
      updateErrorUI();
      renderErrorLogs();
    }

    function copyErrorLogs() {
      if (!errorLogs.length) return alert("لا توجد أخطاء لنسخها.");
      const text = errorLogs.map(e => `[${e.time}] ${e.title}\nDetails: ${e.details}`).join("\n\n---\n\n");
      navigator.clipboard.writeText(text).then(() => {
        alert("تم نسخ السجل بالكامل إلى الحافظة!");
      }).catch(() => {
        alert("فشل النسخ التلقائي، يمكنك نسخه يدوياً من الشاشة.");
      });
    }

    // التقاط أي أخطاء مفاجئة في الجافاسكربت تلقائياً
    window.addEventListener('error', (event) => {
      logError(`JS Runtime Error: ${event.message}`, `${event.filename}:${event.lineno}`);
    });
    window.addEventListener('unhandledrejection', (event) => {
      logError("Unhandled Promise Rejection", event.reason);
    });

    // ----------------- تخزين محلي (IndexedDB) -----------------
    let db;
    const request = indexedDB.open("MangaVocabDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("words")) {
        db.createObjectStore("words", { keyPath: "word" });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; };
    request.onerror = (e) => { logError("IndexedDB Error", e.target.error); };

    function saveWord(word, meaning, sentence) {
      if (!db) return;
      const tx = db.transaction("words", "readwrite");
      const store = tx.objectStore("words");
      store.put({ word: word.trim(), meaning: meaning.trim(), sentence: sentence.trim(), date: new Date().toISOString() });
    }

    function getAllWords(callback) {
      if (!db) return callback([]);
      const tx = db.transaction("words", "readonly");
      const store = tx.objectStore("words");
      const req = store.getAll();
      req.onsuccess = () => callback(req.result);
      req.onerror = () => callback([]);
    }

    function deleteWordFromDB(word, callback) {
      if (!db) return;
      const tx = db.transaction("words", "readwrite");
      const store = tx.objectStore("words");
      store.delete(word);
      tx.oncomplete = () => callback();
    }

    // ----------------- جلب صفحات الفصل مع التشخيص التفصيلي -----------------
    async function loadManga() {
      const url = urlInput.value.trim();
      if (!url) return alert("يرجى إدخال رابط الفصل أولاً.");
      
      loadBtn.disabled = true;
      loadBtn.innerText = "جاري التحميل...";
      reader.innerHTML = "<p style='margin-top:40px; color:#94a3b8;'>جاري جلب صفحات الفصل من المصدر...</p>";

      try {
        const fetchUrl = `${BACKEND_URL}/api/chapter?url=${encodeURIComponent(url)}`;
        const res = await fetch(fetchUrl);
        const resText = await res.text();
        
        let data;
        try {
          data = JSON.parse(resText);
        } catch (jsonErr) {
          logError(`فشل في قراءة رد السيرفر كـ JSON (HTTP ${res.status})`, resText);
          throw new Error(`استجابة غير صالحة من السيرفر (كود ${res.status})`);
        }

        if (!res.ok || !data.success) {
          const errMsg = data.detail || data.error || "السيرفر لم يستطع قراءة صور هذا الرابط.";
          logError(`خطأ من الـ API (كود ${res.status})`, { urlRequested: url, serverResponse: data });
          throw new Error(errMsg);
        }

        if (!data.images || !data.images.length) {
          logError("تم فتح الصفحة لكن لم يتم العثور على وسوم صور صالحة", { urlRequested: url, response: data });
          throw new Error("لم يتم العثور على صور مانجا صالحة داخل هذا الرابط.");
        }

        reader.innerHTML = "";
        data.images.forEach((imgUrl) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'page-wrapper';
          
          const img = document.createElement('img');
          img.className = 'manga-page';
          img.src = `${BACKEND_URL}/api/proxy?img=${encodeURIComponent(imgUrl)}`;
          img.crossOrigin = "anonymous";
          img.loading = "lazy";

          img.onerror = () => {
            logError("فشل تحميل صورة عبر البروكسي", { originalImg: imgUrl, proxySrc: img.src });
          };
          
          wrapper.appendChild(img);
          reader.appendChild(wrapper);
        });

      } catch (err) {
        reader.innerHTML = `<p style='margin-top:40px; color:#f87171;'>حدث خطأ: ${err.message}<br><span style='font-size:0.85rem; color:#94a3b8;'>اضغط على أيقونة 🐞 بالأسفل لمعرفة التفاصيل.</span></p>`;
      } finally {
        loadBtn.disabled = false;
        loadBtn.innerText = "قراءة";
      }
    }

    // ----------------- نمط التحديد باللمس (مُحسّن للشاشات عالية الدقة) -----------------
    function toggleCropMode() {
      isCropMode = !isCropMode;
      cropBtn.classList.toggle('active', isCropMode);
      cropBtn.innerText = isCropMode ? '✕' : '✂️';
      
      if (isCropMode) {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.scale(dpr, dpr);
        canvas.style.display = 'block';
        document.body.style.overflow = 'hidden';
      } else {
        canvas.style.display = 'none';
        document.body.style.overflow = 'auto';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function getTouchPos(e) {
      const t = (e.touches && e.touches.length > 0) ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
      return { x: t.clientX, y: t.clientY };
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const pos = getTouchPos(e);
      startX = pos.x;
      startY = pos.y;
      endX = pos.x;
      endY = pos.y;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      const pos = getTouchPos(e);
      endX = pos.x;
      endY = pos.y;
      
      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);
      const w = Math.abs(endX - startX);
      const h = Math.abs(endY - startY);

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      
      ctx.clearRect(left, top, w, h);
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(left, top, w, h);
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      isDrawing = false;

      const pos = getTouchPos(e);
      endX = pos.x;
      endY = pos.y;

      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);
      const w = Math.abs(endX - startX);
      const h = Math.abs(endY - startY);
      
      // إغلاق وضع التحديد والكانفاس أولاً قبل التقاط الصورة
      toggleCropMode();

      if (w < 15 || h < 15) {
        return; // لمسة عارضة مهملة
      }
      
      captureArea(left, top, w, h);
    }, { passive: false });

    function captureArea(x, y, w, h) {
      // البحث عن صورة المانجا بدقة عبر فحص كل العناصر تحت الإحداثيات
      const centerX = x + w / 2;
      const centerY = y + h / 2;
      const elements = document.elementsFromPoint(centerX, centerY);
      
      let imgElem = null;
      for (const el of elements) {
        if (el.tagName === 'IMG' && el.classList.contains('manga-page')) {
          imgElem = el;
          break;
        }
      }

      // إذا لم يعثر بالمنتصف، يفحص الزوايا الأربع للتحديد
      if (!imgElem) {
        const testPoints = [
          [x + 2, y + 2],
          [x + w - 2, y + 2],
          [x + 2, y + h - 2],
          [x + w - 2, y + h - 2]
        ];
        for (const [px, py] of testPoints) {
          const els = document.elementsFromPoint(px, py);
          for (const el of els) {
            if (el.tagName === 'IMG' && el.classList.contains('manga-page')) {
              imgElem = el;
              break;
            }
          }
          if (imgElem) break;
        }
      }

      if (!imgElem) {
        logError("تعذر العثور على صورة المانجا تحت التحديد", { x, y, w, h });
        alert("يرجى التأكد من التحديد فوق صفحة المانجا.");
        return;
      }

      const imgRect = imgElem.getBoundingClientRect();
      const scaleX = imgElem.naturalWidth / imgRect.width;
      const scaleY = imgElem.naturalHeight / imgRect.height;

      const cropX = Math.max(0, (x - imgRect.left) * scaleX);
      const cropY = Math.max(0, (y - imgRect.top) * scaleY);
      const cropW = Math.min(imgElem.naturalWidth - cropX, w * scaleX);
      const cropH = Math.min(imgElem.naturalHeight - cropY, h * scaleY);

      if (cropW <= 0 || cropH <= 0) {
        alert("أبعاد التحديد غير صالحة، يرجى المحاولة ثانية.");
        return;
      }

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cropW;
      tempCanvas.height = cropH;
      const tCtx = tempCanvas.getContext('2d');

      try {
        tCtx.drawImage(imgElem, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        const base64Data = tempCanvas.toDataURL('image/jpeg', 0.95);
        sendToTranslate(base64Data);
      } catch (err) {
        logError("تعذر اقتصاص الصورة بدقة", err);
        alert("فشل التقاط الصورة: " + err.message);
      }
    }


    // ----------------- طلب الترجمة الفصيحة وتفكيك الكلمات -----------------
    async function sendToTranslate(base64Image) {
      bottomSheet.classList.add('open');
      sheetContent.style.display = 'none';
      loader.style.display = 'block';

      try {
        const res = await fetch(`${BACKEND_URL}/api/ocr-translate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_base64: base64Image })
        });
        const resText = await res.text();
        
        let data;
        try {
          data = JSON.parse(resText);
        } catch (jsonErr) {
          logError(`رد غير صالح من OCR API (HTTP ${res.status})`, resText);
          throw new Error("فشل قراءة رد خدمة الترجمة.");
        }

        if (data.error) {
          logError("خطأ في محرك الترجمة والـ OCR", data);
          throw new Error(data.error);
        }

        currentSentence = data.english_text || "";
        currentTranslation = data.arabic_translation || "";

        document.getElementById('englishText').innerText = currentSentence || "تعذر قراءة النص";
        document.getElementById('arabicText').innerText = currentTranslation || "تعذر الترجمة";

        const wordsBox = document.getElementById('wordsContainer');
        wordsBox.innerHTML = "";
        
        if (data.words && data.words.length) {
          data.words.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
              <span><b>${item.word}</b>: ${item.meaning}</span>
              <button class="add-btn" onclick="handleWordAdd(this, '${item.word.replace(/'/g, "\\'")}', '${item.meaning.replace(/'/g, "\\'")}')">+</button>
            `;
            wordsBox.appendChild(card);
          });
        }

        loader.style.display = 'none';
        sheetContent.style.display = 'block';
      } catch (err) {
        loader.innerText = "خطأ في المعالجة: " + err.message;
      }
    }

    function handleWordAdd(btn, word, meaning) {
      saveWord(word, meaning, currentSentence);
      btn.innerText = "✓";
      btn.classList.add('saved');
      btn.disabled = true;
    }

    function closeSheet() {
      bottomSheet.classList.remove('open');
    }

    // ----------------- إدارة الحافظة وتصدير Anki -----------------
    function openVocabModal() {
      vocabModal.style.display = 'flex';
      renderVocabList();
    }

    function closeVocabModal() {
      vocabModal.style.display = 'none';
    }

    function renderVocabList() {
      getAllWords((words) => {
        if (!words.length) {
          vocabList.innerHTML = "<p style='color:#94a3b8; text-align:center;'>الحافظة فارغة حالياً.</p>";
          return;
        }
        vocabList.innerHTML = "";
        words.forEach(w => {
          const div = document.createElement('div');
          div.className = 'vocab-item';
          div.innerHTML = `
            <span><b>${w.word}</b> — ${w.meaning}</span>
            <button class="delete-btn" onclick="handleDeleteWord('${w.word.replace(/'/g, "\\'")}')">✕</button>
          `;
          vocabList.appendChild(div);
        });
      });
    }

    function handleDeleteWord(word) {
      deleteWordFromDB(word, () => renderVocabList());
    }

    function clearAllVocab() {
      if (confirm("هل تريد تفريغ كامل الكلمات المحفوظة؟")) {
        const tx = db.transaction("words", "readwrite");
        tx.objectStore("words").clear();
        tx.oncomplete = () => renderVocabList();
      }
    }

    function exportAnkiTSV() {
      getAllWords((words) => {
        if (!words.length) return alert("لا توجد كلمات لتصديرها.");
        
        let tsvContent = "";
        words.forEach(w => {
          tsvContent += `${w.word}\t${w.meaning}\t${w.sentence}\n`;
        });

        const blob = new Blob([tsvContent], { type: 'text/tab-separated-values;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Anki_Manga_Vocab_${new Date().toISOString().slice(0,10)}.tsv`;
        link.click();
      });
    }
  </script>
</body>
</html>
